[build-system]
# Minimum requirements for the build system to execute.
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "sitesignal"
version = "0.1.0"
description = "Parcel screening and early-stage diligence engine for renewable energy development."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.139.0",
    "sqlalchemy==2.0.51",
    "psycopg[binary]==3.3.4",
    "pydantic-settings==2.14.2",
    "alembic==1.18.5",
    "geoalchemy2==0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx2==2.7.0",
]

[tool.setuptools.packages.find]
include = ["app*"]