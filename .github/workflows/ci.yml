name: CI

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgis:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: sitesignal_test
          POSTGRES_USER: sitesignal
          POSTGRES_PASSWORD: sitesignal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sitesignal -d sitesignal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://sitesignal:sitesignal@127.0.0.1:5432/sitesignal_test

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type check
        run: python -m mypy app

      - name: Run unit tests
        run: python -m pytest -q

      - name: Run PostGIS integration tests
        run: python -m pytest -q tests/integration
